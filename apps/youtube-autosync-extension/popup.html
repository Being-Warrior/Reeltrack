<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>ReelTrack AutoSync</title></head>
<body><main><p class="eyebrow">REELTRACK</p><h1>AutoSync</h1><p id="status" class="muted">Checking connection…</p><section id="pairing"><label>ReelTrack address<input id="apiBaseUrl" type="url" placeholder="http://localhost:3000"></label><label>Pairing code<input id="code" maxlength="8" placeholder="8-character code"></label><label>This device<input id="deviceName" maxlength="80" placeholder="Chrome on this device"></label><button id="pair">Pair YouTube</button></section><section id="connected" hidden><label class="toggle"><input id="enabled" type="checkbox">Track YouTube playback</label><p id="details" class="muted"></p><button id="unpair" class="secondary">Disconnect this browser</button></section><p id="message" role="status"></p></main><script src="popup.js"></script></body></html>
